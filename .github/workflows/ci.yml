name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install ffmpeg
        # The same jellyfin-ffmpeg the image ships (ADR-0003), not Ubuntu's ffmpeg, so the
        # tests exercise the encoder users run (Ubuntu 26.04's ffmpeg 8.0 fails 5.1 Opus
        # jobs that jellyfin-ffmpeg 8.1 handles). Portable build, checksum verified. Keep
        # the version in step with the image's jellyfin-ffmpeg8 package.
        env:
          JF_FFMPEG: 8.1.3-2
          JF_FFMPEG_SHA256: 1df84d04c4322902dba81c290508cdf3d89524d210b9fe03154bea6c4e3bfbb6
        run: |
          set -eu
          file="jellyfin-ffmpeg_${JF_FFMPEG}_portable_linux64-gpl.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$file" \
            "https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v${JF_FFMPEG}/$file"
          echo "${JF_FFMPEG_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -hide_banner -version | head -n 1
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov=reelhaven --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
